<aside id="appearance"><div class="editorTitle">색상 · 재질 조절 <span>실시간 3D</span></div>
<p class="editorHint">돌려보면서 조절해 보세요. 이 브라우저에 자동 저장됩니다.</p>
<section><h3>칼날의 푸른 면</h3><label>색상 <input id="blueColor" type="color" value="#246aff" aria-label="칼날 색상"><input id="blueHex" class="hex" value="#246aff" aria-label="칼날 색상 코드" maxlength="7"></label>
<label for="blueSaturation">채도 <output></output></label><input id="blueSaturation" type="range" min="0" max="2" step="0.01" value="1">
<label for="blueBrightness">밝기 <output></output></label><input id="blueBrightness" type="range" min="0.25" max="2" step="0.01" value="1"></section>
<section><h3>은빛 칼날 · 테두리</h3><label>색상 <input id="metalColor" type="color" value="#ffffff" aria-label="금속 색상"><input id="metalHex" class="hex" value="#ffffff" aria-label="금속 색상 코드" maxlength="7"></label>
<label for="metalRoughness">거칠기 <output></output></label><input id="metalRoughness" type="range" min="0.08" max="1" step="0.01" value="0.38"></section>
<section hidden><h3>붕대 · 천</h3><label>색상 <input id="clothColor" type="color" value="#b8b1a0" aria-label="붕대 색상"><input id="clothHex" class="hex" value="#b8b1a0" aria-label="붕대 색상 코드" maxlength="7"></label>
<label for="clothBrightness">밝기 <output></output></label><input id="clothBrightness" type="range" min="0.3" max="1.8" step="0.01" value="1">
<label for="clothRoughness">거칠기 <output></output></label><input id="clothRoughness" type="range" min="0.2" max="1" step="0.01" value="0.95">
<label for="clothWeave">천 결 · 요철 <output></output></label><input id="clothWeave" type="range" min="0" max="1" step="0.01" value="0.55"></section>
<div class="presets"><button data-preset="moon">달빛</button><button data-preset="deep">짙은 푸른색</button><button hidden data-preset="linen">낡은 붕대</button></div>
<div class="saveButtons"><button id="saveAppearance">설정 파일 저장</button><button id="loadAppearance">불러오기</button><button id="resetAppearance">초기화</button></div><input type="file" id="appearanceFile" accept="application/json,.json" hidden>
<p id="appearanceStatus" role="status">3D 미리보기에 적용됩니다. 게임 반영은 별도입니다.</p>
<details><summary>게임 적용 아이콘 보기</summary><div id="originalIcon"></div><small>마지막으로 게임에 적용한 색상입니다.</small></details></aside>
