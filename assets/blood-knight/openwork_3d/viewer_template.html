<!doctype html><html lang="ko"><meta charset="utf-8"><title>Bloodfang · 3D 모델</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#ede8e4;font:15px 'Segoe UI',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header{position:fixed;left:30px;top:25px;pointer-events:none}h1{margin:0 0 8px;letter-spacing:3px;font-size:23px;font-weight:500}header p{color:#a6a3a5;font-size:13px;line-height:1.7;margin:0}.panel{position:fixed;left:26px;bottom:25px;display:flex;gap:7px;flex-wrap:wrap;max-width:95vw}button,a{background:#20232be8;color:#d8d4d2;border:1px solid #42444b;border-radius:7px;padding:11px 15px;font:inherit;cursor:pointer;text-decoration:none}button:hover,button.active{background:#4a2831;border-color:#a0606f;color:white}#status{position:fixed;right:24px;bottom:27px;font-size:12px;color:#aaa;pointer-events:none}#err{color:#ff8c8c}body.clean header,body.clean .panel,body.clean #status{display:none}</style>
<header><h1>BLOODFANG / OPENWORK</h1><p>길게 뚫린 창날 · 송곳니 문장 · 금속 사슬 · 피에 물든 짐승털<br>드래그로 회전 / 휠로 확대 / 오른쪽 드래그로 이동</p><p id="err"></p></header>
<div class="panel"><button data-view="front">정면</button><button data-view="three">입체 보기</button><button data-view="head">창날 확대</button><button data-view="back">뒷면</button><button id="spin">자동 회전</button><button id="clay">형태만 보기</button><button id="wire">와이어</button><a href="Bloodfang_Openwork_Spear.glb" download>GLB 저장</a></div><div id="status">모델을 불러오는 중…</div>
<script type="importmap">__IMPORTMAP__</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'controls';import {GLTFLoader} from 'loader';import {RoomEnvironment} from 'room';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#13161c');const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.035).texture;scene.environmentIntensity=.45;
const camera=new THREE.PerspectiveCamera(29,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;controls.autoRotateSpeed=.65;controls.minDistance=.15;controls.maxDistance=20;
scene.add(new THREE.HemisphereLight(0xd6e4ff,0x332827,.65));function light(color,intensity,x,y,z){const l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);scene.add(l);}light(0xffe4d1,1.6,-3,5,5);light(0xb7d0ff,1.2,3,3,-4);light(0xffffff,.5,0,-2,3);
let model,center,extent,clay=false,wire=false;const originals=new Map();
function setView(view){if(!model)return;controls.autoRotate=false;let target=center.clone(),dist=extent*2.30,dir=new THREE.Vector3(0,.03,1);if(view==='three')dir.set(.72,.13,1);if(view==='back')dir.set(.25,.02,-1);if(view==='head'){target.y=center.y+extent*.235;target.x=center.x+.03;dist=extent*1.34;dir.set(.20,.035,1);}camera.position.copy(target).addScaledVector(dir.normalize(),dist);controls.target.copy(target);controls.update();renderer.render(scene,camera);window.currentView=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
window.setView=setView;window.renderer=renderer;window.scene=scene;window.camera=camera;window.controls=controls;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelector('#spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.classList.toggle('active',controls.autoRotate);};
document.querySelector('#clay').onclick=e=>{clay=!clay;e.target.classList.toggle('active',clay);model.traverse(o=>{if(o.isMesh)o.material=clay?new THREE.MeshStandardMaterial({color:0xada9a4,roughness:.61,metalness:.08,side:THREE.DoubleSide,wireframe:wire}):originals.get(o);});};
document.querySelector('#wire').onclick=e=>{wire=!wire;e.target.classList.toggle('active',wire);model.traverse(o=>{if(o.isMesh)o.material.wireframe=wire;});};
try{const bytes=Uint8Array.from(atob('__GLB__'),c=>c.charCodeAt(0));const gltf=await new GLTFLoader().parseAsync(bytes.buffer,'');model=gltf.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model);center=box.getCenter(new THREE.Vector3());extent=box.getSize(new THREE.Vector3()).y;let triangles=0;model.traverse(o=>{if(o.isMesh){originals.set(o,o.material);o.material.envMapIntensity=.9;triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;}});setView(new URLSearchParams(location.search).get('view')||'three');window.model=model;window.viewerReady=true;window.modelStats={triangles,objects:originals.size};document.querySelector('#status').textContent=`실제 3D 모델 · ${triangles.toLocaleString()} 삼각형`;if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('clean');}catch(e){document.querySelector('#err').textContent=e.message;window.viewerError=e.message;console.error(e);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
