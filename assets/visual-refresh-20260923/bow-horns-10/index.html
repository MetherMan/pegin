<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뿔 형태 푸른달 활 10종</title>
<style>
:root{color-scheme:dark;--bg:#07101c;--ink:#e7f5ff;--muted:#a0b8d1;--line:#30455c;--blue:#91d5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#183c58,transparent 900px),var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:40px 28px 60px}header{max-width:750px}header small{letter-spacing:3px;color:var(--blue)}h1{font-size:clamp(30px,4vw,48px);line-height:1.25;letter-spacing:-1.7px;margin:15px 0}header p,.note{color:var(--muted)}a{color:var(--blue)}button{font:inherit;background:#14273b;color:#e3f4ff;border:1px solid #47617b;border-radius:7px;padding:8px 15px;cursor:pointer}button:hover{border-color:#b7e7ff}button:focus-visible,a:focus-visible{outline:2px solid #b7e7ff;outline-offset:4px}button[aria-pressed=true]{background:#23587d;border-color:#9ee3ff}.toolbar{position:sticky;top:0;z-index:2;background:#071322f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;margin:20px 0}.toolbar span{color:#c0e3ff}.toolbar button{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#101c2b}.art{position:relative;display:block;width:100%;border:0;border-radius:0;padding:0;background:#080f18;aspect-ratio:2/3}.art img{display:block;object-fit:contain;width:100%;height:100%}.badge{position:absolute;left:17px;top:17px;background:#071423df;border:1px solid #729dbf;border-radius:5px;padding:3px 10px;font-size:14px;font-weight:700}.info{padding:17px 20px}.info h2{font-size:22px;margin:0 0 13px}.card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.note{font-size:13px;margin-top:28px}#notice{color:var(--blue);min-height:24px}dialog{width:min(1120px,97vw);height:96vh;max-height:96vh;padding:0;border:1px solid #52748e;border-radius:12px;background:#07101b;color:var(--ink)}dialog::backdrop{background:#000d;backdrop-filter:blur(5px)}.dialog-inner{display:flex;flex-direction:column;height:100%}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line)}.dialog-image{flex:1;min-height:0;object-fit:contain;width:100%}.dialog-bottom{display:flex;gap:12px;justify-content:center;align-items:center;padding:12px}.dialog-bottom button{font-size:13px}@media(max-width:650px){main{padding:25px 12px}.grid{grid-template-columns:1fr;gap:20px}.toolbar{flex-wrap:wrap}.dialog-bottom{gap:7px;flex-wrap:wrap}.info h2{font-size:19px}}
.file-actions{display:flex;gap:13px;flex-wrap:wrap}.image-scroll{flex:1;min-height:0;overflow:auto;background:#040b15}.image-scroll .dialog-image{display:block;width:100%;height:100%;object-fit:contain}.image-scroll.zoomed .dialog-image{width:1024px;height:1536px;max-width:none;margin:0 auto}.card-actions{flex-wrap:wrap}.dialog-bottom{flex-wrap:wrap}</style>
<main><header><small>TWILIGHT OF THE BLUE MOON</small><h1>뿔 형태 푸른달 활 10종</h1><p>유려하게 갈라지고 휘어지는 푸른 월뿔을 중심으로 만든 새 활 10종입니다.<br>번호를 비교하며 아래로 둘러보고, 이미지를 눌러 크게 확인하세요.</p><p>기준 시안: <a href="../bow-asymmetric-10/bow-04.png" target="_blank" rel="noopener">A04 · 갈라진 월뿔</a> / <a href="../bow-a04-a05-10/bow-01.png" target="_blank" rel="noopener">V01 · 휘감긴 상현 월뿔</a></p></header>
<div class="toolbar"><span id="selection">선택한 시안 없음</span><div><button id="copy">선택 번호 복사</button> <button id="clear">선택 해제</button></div></div>
<div class="grid" id="gallery">시안을 불러오는 중…</div><p id="notice" aria-live="polite"></p>
<p class="note">내장 ImageGen · 1024×1536 단일 활 원본 10장 · 월뿔 형태 비교.<br>선택은 이 브라우저에만 저장됩니다. <a href="prompts.json">생성 프롬프트·원본 기록</a></p></main>
<dialog id="viewer"><div class="dialog-inner"><div class="dialog-head"><strong id="title"></strong><button id="close">닫기 ×</button></div><div class="image-scroll" id="imageScroll"><img class="dialog-image" id="full" alt=""></div><div class="dialog-bottom"><button id="previous">← 이전</button><button id="pick"></button><button id="zoom" aria-pressed="false">원본 크기</button><a id="original" target="_blank" rel="noopener">원본 열기 ↗</a><a id="download" download>다운로드</a><button id="next">다음 →</button></div></div></dialog>
<script>
const $=s=>document.querySelector(s),gallery=$('#gallery'),viewer=$('#viewer');let catalog=[],current=0,selected='';
try{selected=localStorage.getItem('moon-horns-bow-selection-h01-h10-v1')||''}catch{}
function choose(id){selected=selected===id?'':id;update()}
function pickButton(button,item){const on=selected===item.id;button.textContent=item.id+(on?' 선택됨 ✓':' 선택');button.setAttribute('aria-pressed',String(on));button.onclick=()=>choose(item.id)}
function update(){for(const card of gallery.querySelectorAll('.card'))pickButton(card.querySelector('.pick'),catalog.find(x=>x.id===card.dataset.id));const item=catalog.find(x=>x.id===selected);$('#selection').textContent=item?'선택 · '+item.id+' '+item.name:'선택한 시안 없음';try{localStorage.setItem('moon-horns-bow-selection-h01-h10-v1',selected)}catch{}if(viewer.open)updateDialog()}
function updateDialog(){const item=catalog[current];$('#title').textContent=item.id+' · '+item.name;$('#full').src=item.file;$('#full').alt=item.id+' '+item.name+' 단일 활';$('#original').href=item.file;$('#download').href=item.file;$('#download').download=item.id+'-'+item.file;$('#imageScroll').scrollTo(0,0);pickButton($('#pick'),item)}
function show(index){current=index;updateDialog();viewer.showModal()}
function move(step){current=(current+step+catalog.length)%catalog.length;updateDialog()}
$('#zoom').onclick=()=>{const on=$('#imageScroll').classList.toggle('zoomed');$('#zoom').setAttribute('aria-pressed',String(on));$('#zoom').textContent=on?'화면에 맞춤':'원본 크기';$('#imageScroll').scrollTo(0,0)};$('#close').onclick=()=>viewer.close();$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
$('#clear').onclick=()=>{selected='';update()};$('#copy').onclick=async()=>{if(!selected){$('#notice').textContent='먼저 시안을 선택하세요.';return}try{await navigator.clipboard.writeText($('#selection').textContent);$('#notice').textContent='복사했습니다: '+selected}catch{$('#notice').textContent=$('#selection').textContent}};
fetch('prompts.json').then(r=>{if(!r.ok)throw Error('시안 목록을 불러오지 못했습니다.');return r.json()}).then(data=>{catalog=data.images;if(!catalog.some(item=>item.id===selected))selected='';gallery.replaceChildren();for(const[index,item]of catalog.entries()){const card=document.createElement('article');card.className='card';card.dataset.id=item.id;card.innerHTML='<button class="art"><img decoding="async"><span class="badge"></span></button><div class="info"><h2></h2><div class="card-actions"><button class="pick"></button><span class="file-actions"><a class="original-link" target="_blank" rel="noopener">원본 ↗</a><a class="download-link" download>다운로드</a></span></div></div>';card.querySelector('.art').setAttribute('aria-label',item.id+' '+item.name+' 확대');card.querySelector('img').src=item.file;card.querySelector('img').alt=item.id+' '+item.name+' 단일 활';card.querySelector('.badge').textContent=item.id;card.querySelector('h2').textContent=item.name;card.querySelector('.original-link').href=item.file;card.querySelector('.download-link').href=item.file;card.querySelector('.download-link').download=item.id+'-'+item.file;card.querySelector('img').loading='lazy';card.querySelector('.art').onclick=()=>show(index);gallery.append(card)}update()}).catch(e=>{gallery.textContent=e.message});
</script></html>
