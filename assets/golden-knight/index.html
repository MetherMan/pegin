<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금색 기사 무기 시안</title>
<script type="importmap">{"imports":{"three":"../twilight/vendor/three.module.js","three/addons/controls/OrbitControls.js":"../twilight/vendor/OrbitControls.js","three/addons/loaders/GLTFLoader.js":"../twilight/vendor/GLTFLoader.js","three/addons/environments/RoomEnvironment.js":"../twilight/vendor/RoomEnvironment.js","../twilight/utils/BufferGeometryUtils.js":"../twilight/vendor/BufferGeometryUtils.js"}}</script>
<style>
:root{--bg:#0d0f16;--panel:#151925;--line:#2a3042;--text:#e9ecf4;--muted:#9aa3b8;--gold:#f0c45a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{padding:20px 20px 8px;max-width:1300px;margin:auto}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
h1 span{color:var(--gold)}
p.lead{margin:0 0 12px;color:var(--muted);max-width:900px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.bar b{color:var(--muted);font-weight:500;margin-right:2px}
button{background:#1d2232;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.on{background:#3a2e10;border-color:var(--gold);color:#ffe7a6}
main{max-width:1300px;margin:auto;padding:0 20px 30px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
section h2{margin:0;padding:12px 16px 0;font-size:17px}
.stage{position:relative;height:440px}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.names{display:grid;padding:4px 10px 14px;text-align:center;color:var(--muted);font-size:13px}
.names strong{display:block;color:var(--text);font-size:14px}
@media (max-width:700px){.stage{height:340px}.names{font-size:11px}.names strong{font-size:12px}}
</style>
</head>
<body>
<header>
<h1><span>금색 기사</span> 무기 시안</h1>
<p class="lead">게임에 있는 상위 무기 원본 모델(양손검·롱보우·스태프 각 4종)에 금색 기사 색을 입혔습니다. <b>금색</b>은 금속 전체를 왕실 금빛으로, <b>백금</b>은 칼날·활대처럼 무채색 금속은 흰 은빛, 손잡이·장식은 금빛으로 나눈 성기사 느낌입니다. 보석의 원래 색은 살렸습니다. 아무 화면이나 드래그하면 그 줄 무기가 같이 돕니다. 새로 디자인한 <a href="concepts.html" style="color:#ffd77a">컨셉 그림</a>도 있습니다.</p>
<div class="bar"><b>색</b><button data-style="gold" class="on">금색</button><button data-style="whitegold">백금</button><button data-style="original">원본</button>
<b style="margin-left:12px">회전</b><button id="spin" class="on">자동 회전</button></div>
</header>
<main id="rows"></main>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const KINDS=[['sword','양손검'],['bow','롱보우'],['staff','스태프']];
const catalog=await (await fetch('catalog.json')).json();
const loader=new GLTFLoader();
let style='gold',spin=true,angle=0;const rows=[];
for(const [kind,label] of KINDS){
  const items=catalog.filter(c=>c.kind===kind);
  const sec=document.createElement('section');
  sec.innerHTML=`<h2>${label}</h2><div class="stage"><canvas></canvas></div><div class="names" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(c=>`<div><strong>${c.name}</strong>${c.key} · #${c.item}</div>`).join('')}</div>`;
  document.querySelector('#rows').append(sec);
  const canvas=sec.querySelector('canvas');
  const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor(0x121624);
  const scene=new T.Scene();
  const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
  scene.add(new T.HemisphereLight(0xfff4dc,0x1a2030,.9));
  const sun=new T.DirectionalLight(0xffffff,1.6);sun.position.set(2,4,5);scene.add(sun);
  const camera=new T.PerspectiveCamera(28,1,.01,100);
  const row={kind,items,renderer,scene,camera,canvas,slots:[]};rows.push(row);
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);let x=e.clientX;spin=false;document.querySelector('#spin').classList.remove('on');
    const move=ev=>{angle+=(ev.clientX-x)*.012;x=ev.clientX};canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',()=>canvas.removeEventListener('pointermove',move),{once:true})});
}
async function load(){
  for(const row of rows){
    const models=await Promise.all(row.items.map(c=>loader.loadAsync(`glb/${c.key}-${style}.glb`).then(g=>g.scene)));
    row.slots.forEach(s=>row.scene.remove(s));row.slots=[];
    const gap=1.15,n=models.length;let tall=0;
    models.forEach((m,i)=>{
      const box=new T.Box3().setFromObject(m),c=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());tall=Math.max(tall,size.y);
      m.position.sub(c);const pivot=new T.Group();pivot.add(m);pivot.position.x=(i-(n-1)/2)*gap;row.scene.add(pivot);row.slots.push(pivot)});
    row.span=(n-1)*gap+1;row.tall=tall;fit(row);
  }
}
function fit(row){
  const w=row.canvas.clientWidth,h=row.canvas.clientHeight;if(!w||!h)return;
  row.renderer.setPixelRatio(Math.min(devicePixelRatio,2));row.renderer.setSize(w,h,false);row.camera.aspect=w/h;
  const fov=row.camera.fov*Math.PI/180,needH=row.tall*1.08/(2*Math.tan(fov/2)),needW=row.span/(2*Math.tan(fov/2)*row.camera.aspect);
  const d=Math.max(needH,needW);row.camera.position.set(0,0,d);row.camera.lookAt(0,0,0);row.camera.updateProjectionMatrix();
}
addEventListener('resize',()=>rows.forEach(fit));
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=async()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x===b));await load()});
document.querySelector('#spin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
await load();window.modelsReady=true;
let last=performance.now();
(function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;if(spin)angle+=dt*.6;
  for(const row of rows){if(row.canvas.clientWidth!==row.lastW){row.lastW=row.canvas.clientWidth;fit(row)}row.slots.forEach(s=>s.rotation.y=angle);row.renderer.render(row.scene,row.camera)}})(last);
</script>
</body>
</html>
