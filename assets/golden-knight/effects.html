<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천상의 날개 공격 이펙트</title>
<script type="importmap">{"imports":{"three":"../twilight/vendor/three.module.js","three/addons/loaders/GLTFLoader.js":"../twilight/vendor/GLTFLoader.js","../twilight/utils/BufferGeometryUtils.js":"../twilight/vendor/BufferGeometryUtils.js"}}</script>
<style>
:root{--bg:#0d0f16;--panel:#151925;--line:#2a3042;--text:#e9ecf4;--muted:#9aa3b8;--gold:#f0c45a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1300px;margin:auto;padding:20px}
h1{margin:0 0 6px;font-size:22px}h1 span{color:var(--gold)}
p.lead{margin:0 0 12px;color:var(--muted);max-width:920px}
p.lead a{color:#ffd77a}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar b{color:var(--muted);font-weight:500;margin-left:6px}
button{background:#1d2232;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.on{background:#3a2e10;border-color:var(--gold);color:#ffe7a6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
section h2{margin:0;padding:10px 14px 0;font-size:16px}
section p{margin:2px 14px 8px;color:var(--muted);font-size:13px}
.stage{height:460px}
canvas{display:block;width:100%;height:100%}
@media (max-width:800px){.grid{grid-template-columns:1fr}.stage{height:380px}}
</style>
</head>
<body>
<main>
<h1><span>천상의 날개</span> 공격 이펙트</h1>
<p class="lead">게임에 들어간 실제 파일을 그대로 읽어 그립니다. 검선은 <code>trace.tdf</code>의 텍스처·길이(16프레임)를 쓰고, 화살은 <code>.wed</code> 프레임표·메시·텍스처와 마법 스크립트(<code>cw_arrow.ms</code>)의 속도·잔상·타격을 따릅니다. 원래 색과 바꿔 보며 비교할 수 있습니다. 화살은 실제로 매우 빨라(약 0.1초) 느리게 보기를 함께 두었습니다. 게임 조명·캐릭터 모션은 들어 있지 않은 브라우저 재현입니다. <a href="models.html">무기 3D</a> · <a href="skills/sevenfold.html">칠익난무 스킬 제안</a></p>
<div class="bar"><b>색</b><button data-set="gold" class="on">금색 (천상의 날개)</button><button data-set="original">원래 (성기사 검선 · 기본 화살)</button>
<b>속도</b><button data-speed="1">1배</button><button data-speed="0.5" class="on">0.5배</button><button data-speed="0.2">0.2배</button><button data-speed="0.08">0.08배</button>
<button id="pause">일시정지</button></div>
<div class="grid">
<section><h2>양손검 휘두르기 · 검선</h2><p id="trail-note"></p><div class="stage"><canvas id="sword"></canvas></div></section>
<section><h2>롱보우 쏘기 · 화살 · 잔상 · 타격</h2><p id="arrow-note"></p><div class="stage"><canvas id="bow"></canvas></div></section>
</div>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const data=await (await fetch('effects-preview.json')).json();
const up=new THREE.Vector3(0,1,0);
let set='gold',speed=.5,playing=true;
const textures={};
const loader=new THREE.TextureLoader();
await Promise.all(Object.entries(data.textures).map(async([name,url])=>{const t=await loader.loadAsync(url);t.flipY=false;t.colorSpace=THREE.NoColorSpace;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.needsUpdate=true;textures[name]=t}));
const geometries={};
for(const [name,m] of Object.entries(data.meshes)){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(m.vertices.flatMap(v=>v.slice(0,3)),3));g.setAttribute('uv',new THREE.Float32BufferAttribute(m.vertices.flatMap(v=>v.slice(3,5)),2));g.setIndex(m.indices);geometries[name]=g}
const additive={transparent:true,depthWrite:false,blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,toneMapped:false};
function ribbon(textureName){
  const n=64,g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*6),3));g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*4),2));g.setAttribute('brightness',new THREE.BufferAttribute(new Float32Array(n*2),1));
  const idx=[];for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}g.setIndex(idx);g.setDrawRange(0,0);
  const m=new THREE.ShaderMaterial({uniforms:{map:{value:textures[textureName]}},side:THREE.DoubleSide,...additive,
    vertexShader:'attribute float brightness;varying vec2 v;varying float l;void main(){v=uv;l=brightness;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform sampler2D map;varying vec2 v;varying float l;void main(){gl_FragColor=vec4(texture2D(map,v).rgb*l,1.0);}'});
  const mesh=new THREE.Mesh(g,m);mesh.frustumCulled=false;return mesh;
}
// Same per-sample layout as the Skill preview (native EtcEffect): newest sample bright at u=0,
// older samples fade by 255/count steps.
function fillRibbon(mesh,pairs){
  const g=mesh.geometry,p=g.attributes.position,u=g.attributes.uv,b=g.attributes.brightness,count=pairs.length;
  for(let i=0;i<count;i++){const [a,c]=pairs[i];p.setXYZ(i*2,a.x,a.y,a.z);p.setXYZ(i*2+1,c.x,c.y,c.z);
    const uu=1-i/Math.max(1,count-1),light=(255-Math.floor(255/count)*(count-1-i))/255;u.setXY(i*2,uu,0);u.setXY(i*2+1,uu,1);b.setX(i*2,light);b.setX(i*2+1,light)}
  p.needsUpdate=u.needsUpdate=b.needsUpdate=true;g.setDrawRange(0,Math.max(0,count-1)*6);
}
function stage(canvas){
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setClearColor(0x0b121c);
  const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xfff4dc,0x1a2030,1.1));const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(2,4,5);scene.add(sun);
  const grid=new THREE.GridHelper(20,20,0x2a3d4c,0x1a2a38);scene.add(grid);
  const camera=new THREE.PerspectiveCamera(34,1,.05,80);
  const fit=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
  new ResizeObserver(fit).observe(canvas);fit();
  return {renderer,scene,camera};
}
const gltf=new GLTFLoader();
// ---------- sword ----------
const S=stage(document.querySelector('#sword'));S.camera.position.set(.6,1.9,4.6);S.camera.lookAt(0,1.25,0);
const sword=(await gltf.loadAsync('models/sword-native.glb')).scene;
const arm=new THREE.Group();arm.position.set(0,1.35,0);S.scene.add(arm);
const hand=new THREE.Group();hand.position.set(0,.45,0);arm.add(hand);hand.add(sword);sword.rotation.y=Math.PI/2;
const ROOT=new THREE.Vector3(0,.6092,0),TIP=new THREE.Vector3(0,1.6573,0);  // Trace.txt blade line (preview Y = native X)
let swordTrail=ribbon(data.traces[data.scripts.gold.trail].texture);S.scene.add(swordTrail);
const swordSamples=[];let swordFrame=-1;
function swingAngle(t){ // 1.6 s loop: wind-up, fast diagonal slash, follow-through, return
  const k=t%1600;const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  if(k<300)return 2.1+.25*ease(k/300);
  if(k<620)return 2.35-4.1*ease((k-300)/320);
  if(k<900)return -1.75;
  return -1.75+4.1*ease((k-900)/700);
}
arm.rotation.set(-.35,.55,0);
// ---------- bow ----------
const B=stage(document.querySelector('#bow'));B.camera.position.set(3.2,2.6,6.4);B.camera.lookAt(3.3,1.1,0);
const bow=(await gltf.loadAsync('models/longbow-native.glb')).scene;bow.position.set(0,1.3,0);bow.rotation.y=-Math.PI/2.4;B.scene.add(bow);
const START=new THREE.Vector3(.15,1.3,0),END=new THREE.Vector3(7,1.2,0);
const target=new THREE.Mesh(new THREE.RingGeometry(.28,.31,48),new THREE.MeshBasicMaterial({color:0x738896,side:THREE.DoubleSide}));target.rotation.x=-Math.PI/2;target.position.set(7,.01,0);B.scene.add(target);
const facing=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),END.clone().sub(START),up));
const flight=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(START,END,up));
function nativeMatrix(f){const sx=f[9],sy=f[8],sz=f[10],w=f[7],axis=new THREE.Vector3(f[3],f[4],f[5]),r=new THREE.Matrix4();
  if(axis.lengthSq()>0)r.makeRotationAxis(axis.normalize(),-f[6]*Math.PI/180);
  const m=new THREE.Matrix4().makeScale(sx/w,sy/w,sz/w).multiply(r);m.setPosition(f[0]*sx,f[1]*sy,f[2]*sz);return m}
function effectMesh(name){const e=data.effects[name];
  const m=new THREE.ShaderMaterial({uniforms:{map:{value:textures[e.texture]},tint:{value:new THREE.Vector3(1,1,1)}},side:THREE.FrontSide,...additive,
    vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform sampler2D map;uniform vec3 tint;varying vec2 v;void main(){gl_FragColor=vec4(texture2D(map,v).rgb*tint,1.0);}'});
  const mesh=new THREE.Mesh(geometries[e.mesh],m);mesh.matrixAutoUpdate=false;mesh.frustumCulled=false;mesh.visible=false;B.scene.add(mesh);return {mesh,effect:e}}
function frameAt(e,ms,loop){let f=Math.floor(ms*data.fps/1000);if(f>=e.end){if(loop)f%=e.end;else return null}if(f===e.end-1)f=e.end;if(ms*data.fps/1000<=e.start)f=e.start;return e.frames[f]}
function place(item,f,position,orientation){if(!f||!f[7]){item.mesh.visible=false;return}item.mesh.visible=true;
  const world=new THREE.Matrix4().compose(position,orientation,new THREE.Vector3(1,1,1));item.mesh.matrix.multiplyMatrices(world,nativeMatrix(f));item.mesh.matrixWorldNeedsUpdate=true;
  item.mesh.material.uniforms.tint.value.set(...[16,8,0].map(s=>((f[11]>>>s)&255)/255))}
let arrowParts;
function buildArrow(){
  if(arrowParts){[arrowParts.projectile,arrowParts.hit].forEach(x=>B.scene.remove(x.mesh));B.scene.remove(arrowParts.trail)}
  const script=data.scripts[set].arrow.find(e=>e.wed);const attack=script.parts.find(p=>p.ATTACK),tail=script.parts.find(p=>p.TAIL);
  const flightMs=Math.ceil(START.distanceTo(END)/((attack.SPEED||1000)/1000))*1000/data.fps;
  arrowParts={projectile:effectMesh(script.wed),hit:effectMesh(tail.TAIL),trail:ribbon(data.traces[script.trace].texture),width:attack.TRACEDIST??.25,flightMs,loop:script.loop,trace:data.traces[script.trace]};
  B.scene.add(arrowParts.trail);
  document.querySelector('#arrow-note').textContent=`${script.wed} → ${tail.TAIL} · 잔상 ${script.trace} · 비행 ${Math.round(flightMs)}ms (속도 ${attack.SPEED})`;
}
function rebuild(){
  S.scene.remove(swordTrail);const t=data.traces[data.scripts[set].trail];swordTrail=ribbon(t.texture);S.scene.add(swordTrail);swordSamples.length=0;
  document.querySelector('#trail-note').textContent=`검선 ${data.scripts[set].trail} · 텍스처 ${t.texture} · 길이 ${t.level}프레임`;
  buildArrow();
}
rebuild();
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{set=b.dataset.set;document.querySelectorAll('[data-set]').forEach(x=>x.classList.toggle('on',x===b));rebuild()});
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};
let time=0,last=performance.now();
function update(){
  // sword: one trail sample per 1/30 s of game time, kept for the trace length
  arm.rotation.z=swingAngle(time);arm.updateMatrixWorld(true);
  const frame=Math.floor(time*data.fps/1000);
  if(frame!==swordFrame){swordFrame=frame;swordSamples.push([ROOT.clone().applyMatrix4(sword.matrixWorld),TIP.clone().applyMatrix4(sword.matrixWorld)]);
    const level=data.traces[data.scripts[set].trail].level;while(swordSamples.length>level+1)swordSamples.shift()}
  const k=time%1600,active=k>=280&&k<1000;
  swordTrail.visible=active;if(active)fillRibbon(swordTrail,swordSamples);
  // bow: shot every 1.4 s
  const shot=time%1400,A=arrowParts,P=A.projectile,H=A.hit;
  const flying=shot<A.flightMs,pos=START.clone().lerp(END,Math.min(1,shot/A.flightMs));
  place(P,flying?frameAt(P.effect,shot,A.loop):null,pos,flight);
  place(H,shot>=A.flightMs?frameAt(H.effect,shot-A.flightMs,false):null,END,facing);
  const trailVisible=shot<A.flightMs+500;A.trail.visible=trailVisible;
  if(trailVisible){const step=1000/data.fps,lastF=Math.floor(shot/step),first=Math.max(0,lastF-A.trace.level),pairs=[];
    for(let f=first;f<=lastF;f++){const age=f*step,pt=START.clone().lerp(END,Math.min(1,age/A.flightMs)),w=age<A.flightMs?A.width:.25;pairs.push([new THREE.Vector3(pt.x,pt.y,pt.z-w),new THREE.Vector3(pt.x,pt.y,pt.z+w)])}
    fillRibbon(A.trail,pairs)}
}
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(100,t-last);last=t;if(playing)time+=dt*speed;update();S.renderer.render(S.scene,S.camera);B.renderer.render(B.scene,B.camera)})(last);
// Verification aid: render one moment and summarise the drawn pixels (also works with the tab hidden).
window.probe=(t,which)=>{time=t;update();const R=which==='bow'?B:S;R.renderer.render(R.scene,R.camera);
  const gl=R.renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,px=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let n=0,r=0,g=0,b=0;for(let i=0;i<px.length;i+=4){const R0=px[i],G0=px[i+1],B0=px[i+2];if(R0+G0+B0>200&&Math.abs(R0-G0)+Math.abs(G0-B0)>40){n++;r+=R0;g+=G0;b+=B0}}
  return {coloured:n,avg:n?[Math.round(r/n),Math.round(g/n),Math.round(b/n)]:null,trail:swordTrail.visible,arrow:arrowParts.projectile.mesh.visible,hit:arrowParts.hit.mesh.visible}};
window.effectsReady=true;
</script>
</body>
</html>
