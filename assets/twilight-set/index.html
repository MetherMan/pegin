<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>푸른달의 트와일라잇 무기 검수</title>
<style>body{overflow:hidden;margin:0;background:#171d29;color:#dce8ff;font:15px system-ui}header{position:relative;z-index:2;padding:14px 20px;background:#171d29}h1{font-size:22px;color:#72cfff;margin:0 0 12px}button{padding:10px 16px;margin:4px;background:#2b3851;border:1px solid #586783;border-radius:6px;color:white;cursor:pointer}button.active{background:#2655a0}#status{position:absolute;bottom:14px;left:22px}canvas{display:block}p{margin:8px 0;color:#aabbcf}</style>
<header><h1>푸른달의 트와일라잇 · 게임 모델</h1><div id="weapons"><button data-key="longbow">H03 활</button><button data-key="staff">월식 갈고리 지팡이</button><button data-key="sword">S4 검</button></div><div><button id="front">정면</button><button id="quarter">사선</button><button id="side">옆면</button><button id="back">뒷면</button></div><p>드래그로 회전 · 휠로 확대 · 실제 MOD/WTM 파일을 다시 읽은 모델</p><p><a id="concept" target="_blank" style="color:#9cdbff">ImageGen 시안 보기</a> · <a href="readability.html" style="color:#9cdbff">캐릭터와 크기 비교</a></p></header><div id="status">불러오는 중…</div>
<script type="importmap">{"imports":{"three":"../twilight/vendor/three.module.js","three/addons/controls/OrbitControls.js":"../twilight/vendor/OrbitControls.js","three/addons/loaders/GLTFLoader.js":"../twilight/vendor/GLTFLoader.js","../twilight/utils/BufferGeometryUtils.js":"../twilight/vendor/BufferGeometryUtils.js"}}</script>
<script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#171d29');const camera=new T.PerspectiveCamera(33,innerWidth/innerHeight,.01,100);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,Math.max(120,innerHeight-document.querySelector("header").offsetHeight));renderer.setPixelRatio(devicePixelRatio);renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xeaf3ff,0x627084,2));for(const [x,y,z,intensity] of [[3,4,5,2],[-4,1,-3,1.5]]){const l=new T.DirectionalLight(0xffffff,intensity);l.position.set(x,y,z);scene.add(l)}
let model,center=new T.Vector3(),distance=4,selected='longbow';const loader=new GLTFLoader();
function view(angle){camera.position.set(center.x+Math.sin(angle)*distance,center.y,center.z+Math.cos(angle)*distance);controls.target.copy(center);controls.update()}
async function show(key){document.querySelector('#status').textContent='불러오는 중…';const gltf=await loader.loadAsync(key+'-native.glb?v='+(key==='sword'?'noble-s4-v1':key==='staff'?'eclipse-hook-staff-v1':'h03-horn-bow-v1'));if(model)scene.remove(model);model=gltf.scene;scene.add(model);selected=key;document.querySelector('#concept').href='../visual-refresh-20260923/'+({sword:'noble-moon-15/sword-04.png',longbow:'bow-horns-10/bow-03.png',staff:'moon-pairs-10/pair-03.png'})[key];const box=new T.Box3().setFromObject(model);box.getCenter(center);distance=box.getSize(new T.Vector3()).y*2.0;view(0);document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('active',b.dataset.key===key));document.querySelector('#status').textContent=({longbow:'롱보우',staff:'스태프',sword:'양손검'})[key]+' · 게임 파일 읽기 완료';window.modelReady=key}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>show(b.dataset.key));document.querySelector('#front').onclick=()=>view(0);document.querySelector('#quarter').onclick=()=>view(Math.PI/3);document.querySelector('#side').onclick=()=>view(Math.PI/2);document.querySelector('#back').onclick=()=>view(Math.PI);const requestedWeapon=new URLSearchParams(location.search).get('weapon');show(['longbow','staff','sword'].includes(requestedWeapon)?requestedWeapon:'longbow');
function resize(){const height=Math.max(120,innerHeight-document.querySelector('header').offsetHeight);camera.aspect=innerWidth/height;camera.updateProjectionMatrix();renderer.setSize(innerWidth,height)}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></html>
