import * as T from 'three';import{OrbitControls}from'controls';
const data=await(await fetch('model.json?v=satin-keratin-v5',{cache:'no-store'})).json(),c=data.primordial[1],s=new T.Scene();s.background=new T.Color('#282c32');

const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;document.body.append(r.domElement);
